name: CSS sanity check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated theme
        run: python tools/build-theme.py --check
      - name: Check for exact Discord hash selectors
        run: python tools/audit_css.py
